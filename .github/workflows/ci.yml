name: Platform CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: shipwise_tests
          POSTGRES_USER: shipwise_tests
          POSTGRES_PASSWORD: local-tests-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shipwise_tests -d shipwise_tests"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: shipwise_tests
          RABBITMQ_DEFAULT_PASS: local-tests-only
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      # Disposable CI-only service credentials, matching deploy/compose.yaml defaults.
      SHIPWISE_TEST_POSTGRES: Host=localhost;Port=5432;Database=shipwise_tests;Username=shipwise_tests;Password=local-tests-only
      SHIPWISE_TEST_RABBITMQ: amqp://shipwise_tests:local-tests-only@localhost:5672/
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins 10.0.301 with latestFeature roll-forward; any newer 10.0 SDK satisfies it.
          dotnet-version: 10.0.x
      - name: Verify platform (architecture, build, all tests including infrastructure)
        shell: pwsh
        run: ./scripts/Verify-Platform.ps1 -RequireInfrastructure
      - name: Fail if any test was skipped
        if: success()
        shell: pwsh
        run: |
          # xUnit records skipped tests as per-test NotExecuted outcomes (the summary
          # notExecuted counter stays 0), so count the individual results.
          $skipped = 0
          foreach ($file in Get-ChildItem artifacts/tests -Filter *.trx) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName -Raw
            $skipped += @($trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'NotExecuted').Count
          }
          if ($skipped -gt 0) { throw "$skipped test(s) were skipped; infrastructure tests must run in CI." }
          Write-Output 'No skipped tests.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-test-results
          path: artifacts/tests/
          retention-days: 7
